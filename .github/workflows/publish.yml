name: Publish to NPM

on:
  push:
    branches:
      - master

jobs:
  publish:
    name: Publish Package to NPM
    environment: gh-actions-environment
    runs-on: ubuntu-latest

    permissions:
      contents: read # Read repository code
      id-token: write # Generate OIDC token for npm authentication

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Verify release candidate
        run: pnpm verify

      - name: Perform publishing to NPM registry
        # The version is still a `snapshot`, so NPM requires it to be tagged accordingly.
        run: pnpm --filter @spine-event-engine/validation publish --tag snapshot --no-git-checks
