version: v2
modules:
  - path: proto
lint:
  use:
    - STANDARD
  ignore_only:
    PACKAGE_DEFINED:
      - proto/spine/options.proto
    PACKAGE_VERSION_SUFFIX:
      - proto/product.proto
      - proto/user.proto
      - proto/testing/invalid_configuration.proto
    IMPORT_USED:
      # Keep User in ProductEnvelope's file dependency closure so a packed User
      # Any is resolvable without a synthetic schema field.
      - proto/product.proto
    FIELD_LOWER_SNAKE_CASE:
      - proto/spine/options.proto
    ENUM_NO_ALLOW_ALIAS:
      - proto/spine/options.proto
    ENUM_VALUE_PREFIX:
      - proto/spine/options.proto
    ENUM_ZERO_VALUE_SUFFIX:
      - proto/spine/options.proto
    PACKAGE_DIRECTORY_MATCH:
      - proto/product.proto
      - proto/user.proto
      - proto/testing/invalid_configuration.proto
breaking:
  use:
    - FILE
