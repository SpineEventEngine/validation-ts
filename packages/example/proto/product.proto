syntax = "proto3";

package example;

import "google/protobuf/any.proto";
import "google/protobuf/timestamp.proto";
import "spine/options.proto";
import "user.proto";

// Identifies one catalog product.
message ProductId {
    // Stores the required product code in the prod-number format.
    string value = 1 [(required) = true,
                      (pattern).regex = "^prod-[0-9]+$",
                      (pattern).error_msg = "Product ID must follow format 'prod-XXX'."];
}

// Represents a catalog product returned by the example storefront.
message Product {
    // Stores the required catalog product identifier.
    ProductId id = 1 [(required) = true,
                    (validate) = true];

    // Supplies the required customer-facing product name.
    string name = 2 [(required) = true,
                     (if_missing).error_msg = "Product name is required."];

    // Describes the product for catalog display.
    string description = 3;

    // Records the sale price, which must be at least one cent.
    double price = 4 [(min).value = "0.01",
                      (min).error_msg = "Price must be at least `${min.value}`. Provided: `${field.value}`."];

    // Records available inventory within the supported stock range.
    int32 stock = 5 [(min).value = "0",
                     (range).value = "[0..1000000)"];

    // Captures when the catalog entry was created.
    google.protobuf.Timestamp created_at = 6;

    // Carries the validated category assigned to the product.
    Category category = 7 [(required) = true,
                           (validate) = true];

    // Sets the text color only when a highlight color is also supplied.
    Color text_color = 8 [(goes).with = "highlight_color"];

    // Sets the highlight color only when a text color is also supplied.
    Color highlight_color = 9 [(goes).with = "text_color"];
}

// Represents the RGB color components used by product display settings.
message Color {
    // Stores the red component on the inclusive 0–255 scale.
    int32 red = 1 [(range).value = "[0..255]"];

    // Stores the green component on the inclusive 0–255 scale.
    int32 green = 2 [(range).value = "[0..255]"];

    // Stores the blue component on the inclusive 0–255 scale.
    int32 blue = 3 [(range).value = "[0..255]"];
}

// Identifies one catalog category.
message CategoryId {
    // Stores the catalog category identifier text.
    string value = 1 [(required) = true];
}

// Identifies the catalog category assigned to a product.
message Category {
    // Holds the required catalog category identifier.
    CategoryId id = 1 [(required) = true,
                     (validate) = true];

    // Holds the required category label.
    string name = 2 [(required) = true];

    // Holds optional category context for display or filtering.
    string context = 3;
}

// Captures one required payment method for a checkout request.
message PaymentMethod {
    // Requires exactly one supported checkout payment method.
    oneof method {
        option (choice).required = true;

        // Carries validated card payment details.
        PaymentCardNumber payment_card = 1 [(validate) = true];

        // Carries validated bank-transfer details.
        BankAccount bank_account = 2 [(validate) = true];
    }
}

// Contains the details needed to charge a payment card.
message PaymentCardNumber {
    // Stores the required 13-to-19 digit card number.
    string number = 1 [(required) = true,
                       (pattern).regex = "^[0-9]{13,19}$",
                       (pattern).error_msg = "Card number must be 13-19 digits."];

    // Stores the card expiration month.
    int32 expiry_month = 2 [(range).value = "[1..12]"];

    // Stores the card expiration year, beginning in 2024.
    int32 expiry_year = 3 [(min).value = "2024"];
}

// Contains the details needed to route a bank payment.
message BankAccount {
    // Stores the required 8-to-17 digit account number.
    string account_number = 1 [(required) = true,
                               (pattern).regex = "^[0-9]{8,17}$"];

    // Stores the required nine-digit routing number.
    string routing_number = 2 [(required) = true,
                               (pattern).regex = "^[0-9]{9}$"];
}

// Requests one page of catalog products.
message ListProductsRequest {
    // Selects the one-based page to retrieve.
    int32 page = 1 [(min).value = "1"];

    // Limits each returned page to 1 through 100 products.
    int32 page_size = 2 [(range).value = "[1..100]"];

    // Narrows results to products matching the optional query.
    string search_query = 3;
}

// Returns a page of catalog products and the total match count.
message ListProductsResponse {
    // Lists the returned catalog products with checks enabled.
    repeated Product products = 1 [(validate) = true];

    // Reports the non-negative number of matching products.
    int32 total_count = 2 [(min).value = "0"];
}

// Wraps a resolvable Any value for catalog examples.
message ProductEnvelope {
    // Carries the Any value whose account details are checked.
    google.protobuf.Any payload = 1 [(validate) = true];
}
