      - proto/test-pattern.proto
      - proto/test-range.proto
      - proto/test-required-field.proto
      - proto/test-required.proto
      - proto/test-validate.proto
    PACKAGE_DIRECTORY_MATCH:
      - proto/integration-account.proto
      - proto/integration-product.proto
      - proto/integration-user.proto
      - proto/test-choice.proto
      - proto/test-distinct.proto
      - proto/test-goes.proto
      - proto/test-min-max.proto
      - proto/test-pattern.proto
      - proto/test-range.proto
      - proto/test-required-field.proto
      - proto/test-required.proto
      - proto/test-validate.proto
