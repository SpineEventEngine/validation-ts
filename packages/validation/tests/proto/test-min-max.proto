syntax = "proto3";

package spine.validation.testing.minmax_suite;

// Test messages for the `(min)` and `(max)` validation options.
//
// This file contains test cases for numeric range validation using minimum and
// maximum constraints. Supports inclusive/exclusive bounds, custom error messages,
// and validation across different numeric types and repeated fields.

import "spine/options.proto";

// Tests basic min constraint (inclusive by default).
message MinValue {
    int32 positive_id = 1 [(min).value = "1"];
    int32 non_negative = 2 [(min).value = "0"];
    double price = 3 [(min).value = "0.01"];
}

// Tests basic max constraint (inclusive by default).
message MaxValue {
    int32 percentage = 1 [(max).value = "100"];
    double altitude = 2 [(max).value = "8848.86"];
    int64 year = 3 [(max).value = "2100"];
}

// Tests combined min and max constraints.
message MinMaxRange {
    int32 age = 1 [(min).value = "0", (max).value = "150"];
    double temperature = 2 [(min).value = "-273.15", (max).value = "1000.0"];
    int32 percentage = 3 [(min).value = "0", (max).value = "100"];
}

// Tests exclusive bounds.
message ExclusiveBounds {
    double positive_value = 1 [(min) = {
        value: "0.0",
        exclusive: true
    }];
    double temperature_kelvin = 2 [(min) = {
        value: "0.0",
        exclusive: true,
        error_msg: "Temperature cannot reach {other}K, but provided {value}."
    }];
    int32 below_limit = 3 [(max) = {
        value: "100",
        exclusive: true
    }];
}

// Tests custom error messages.
message CustomErrorMessages {
    int32 age = 1 [(min) = {
        value: "18",
        error_msg: "Must be at least {other} years old. Provided: {value}."
    }];
    double balance = 2 [(min) = {
        value: "0.01",
        error_msg: "Balance must be at least ${other}. Current: ${value}."
    }, (max) = {
        value: "1000000.0",
        error_msg: "Balance cannot exceed ${other}. Current: ${value}."
    }];
}

// Tests min/max validation across different numeric types.
message NumericTypes {
    int32 int32_field = 1 [(min).value = "0", (max).value = "2147483647"];
    int64 int64_field = 2 [(min).value = "0"];
    uint32 uint32_field = 3 [(max).value = "4294967295"];
    uint64 uint64_field = 4 [(min).value = "1"];
    float float_field = 5 [(min).value = "0.0", (max).value = "100.0"];
    double double_field = 6 [(min).value = "-1000.0", (max).value = "1000.0"];
}

// Tests min/max validation on repeated fields.
message RepeatedMinMax {
    repeated int32 scores = 1 [(min).value = "0", (max).value = "100"];
    repeated double prices = 2 [(min).value = "0.01"];
    repeated float measurements = 3 [(min).value = "0.0", (max).value = "100.0"];
}

// Tests combined required and min/max constraints.
message CombinedConstraints {
    int32 product_id = 1 [(min).value = "1"];
    double price = 2 [
        (min) = {
            value: "0.01",
            error_msg: "Price must be at least {other}."
        }
    ];
    int32 stock = 3 [(min).value = "0"];
}

// Tests optional fields with min/max constraints.
message OptionalMinMax {
    int32 optional_count = 1 [(min).value = "1"];
    double optional_rating = 2 [(max).value = "5.0"];
}

// Contract cases for exact literal parsing, descriptors, and 64-bit values.
message NumericBoundsContract {
    int64 precise_min = 1 [(min).value = "9007199254740993"];
    uint64 precise_max = 2 [(max).value = "9007199254740993"];
    repeated int64 repeated_precise = 3 [(min).value = "9007199254740993"];
}

message InvalidMinSuffix { int32 value = 1 [(min).value = "1x"]; }
message InvalidMinFloat { double value = 1 [(min).value = "1"]; }
message InvalidMinUnsigned { uint32 value = 1 [(min).value = "-1"]; }
message InvalidMinTarget { string value = 1 [(min).value = "1"]; }

message NumericLimits {
    int64 lower = 1;
    double upper = 2;
}

message NumericReferences {
    NumericLimits limits = 1;
    int64 actual = 2 [(min).value = "limits.lower"];
    double measured = 3 [(max).value = "limits.upper"];
}
message MissingNumericReference { int32 value = 1 [(min).value = "does_not_exist"]; }
message IncompatibleNumericReference { NumericLimits limits = 1; int32 value = 2 [(min).value = "limits"]; }

message NumericScalarMatrix {
    sint32 sint32_value = 1 [(min).value = "-1"];
    sint64 sint64_value = 2 [(max).value = "9007199254740993"];
    fixed32 fixed32_value = 3 [(min).value = "1"];
    fixed64 fixed64_value = 4 [(max).value = "9007199254740993"];
    sfixed32 sfixed32_value = 5 [(min).value = "-1"];
    sfixed64 sfixed64_value = 6 [(max).value = "9007199254740993"];
}

message CrossTypeReferences {
    double double_bound = 1;
    int64 int64_bound = 2;
    int64 integer_value = 3 [(min).value = "double_bound"];
    double floating_value = 4 [(max).value = "int64_bound"];
}

message InvalidInt32Overflow { int32 value = 1 [(min).value = "2147483648"]; }
message InvalidUint32Overflow { uint32 value = 1 [(max).value = "4294967296"]; }
message InvalidInt64Overflow { int64 value = 1 [(min).value = "9223372036854775808"]; }
message InvalidUint64Overflow { uint64 value = 1 [(max).value = "18446744073709551616"]; }
message InvalidUint64Negative { uint64 value = 1 [(min).value = "-1"]; }
message InvalidIntegerDecimal { sint32 value = 1 [(min).value = "1.0"]; }
message InvalidFloatExponent { double value = 1 [(min).value = "1.0e"]; }
message InvalidFloatOverflow { float value = 1 [(min).value = "3.5e38"]; }
message InvalidDoubleOverflow { double value = 1 [(min).value = "1.8e308"]; }
