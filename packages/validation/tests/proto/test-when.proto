
syntax = "proto3";

package tests;

import "google/protobuf/timestamp.proto";
import "spine/options.proto";
import "spine/time/time.proto";
import "spine/time_options.proto";

// Fixture `TimeValidation` exercises `(when)`.
message TimeValidation {
    // Validates `past_timestamp` with `(when).in = PAST`.
    google.protobuf.Timestamp past_timestamp = 1 [(when).in = PAST];
    // Validates `future_timestamp` with `(when).in = FUTURE`.
    google.protobuf.Timestamp future_timestamp = 2 [(when).in = FUTURE];
    // Validates `past_year_month` with `(when).in = PAST`.
    spine.time.YearMonth past_year_month = 3 [(when).in = PAST];
    // Validates `future_date` with `(when).in = FUTURE`.
    spine.time.LocalDate future_date = 4 [(when).in = FUTURE];
    // Validates `past_date_time` with `(when).in = PAST`.
    spine.time.LocalDateTime past_date_time = 5 [(when).in = PAST];
    // Validates `future_offset_date_time` with `(when).in = FUTURE`.
    spine.time.OffsetDateTime future_offset_date_time = 6 [(when).in = FUTURE];
    // Validates `past_zoned_date_time` with `(when).in = PAST`.
    spine.time.ZonedDateTime past_zoned_date_time = 7 [(when).in = PAST];
    // Validates `future_timestamps` with `(when).in = FUTURE`.
    repeated google.protobuf.Timestamp future_timestamps = 8 [(when).in = FUTURE];
    // Validates `past_timestamp_by_name` with `(when).in = PAST`.
    map<string, google.protobuf.Timestamp> past_timestamp_by_name = 9 [(when).in = PAST];
    // Validates `disabled` with `(when).in = TIME_UNDEFINED`.
    google.protobuf.Timestamp disabled = 10 [(when).in = TIME_UNDEFINED];
    // Validates `custom_message` with `(when).in = PAST`, `(when).error_msg = "custom ${when.in} ${field.path}"`.
    google.protobuf.Timestamp custom_message = 11 [(when).in = PAST, (when).error_msg = "custom ${when.in} ${field.path}"];
    // Validates `legacy_message` with `(when).in = PAST`, `(when).msg_format = "ignored"`.
    google.protobuf.Timestamp legacy_message = 12 [(when).in = PAST, (when).msg_format = "ignored"];
    // Validates `past_offset_date_time` with `(when).in = PAST`.
    spine.time.OffsetDateTime past_offset_date_time = 13 [(when).in = PAST];
}

// Deliberately tests invalid configuration `(when).in = PAST`.
message UnsupportedWhenTarget {
    // Validates `unsupported` with `(when).in = PAST`.
    string unsupported = 1 [(when).in = PAST];
}
// Deliberately tests invalid configuration `(when).in = PAST`, `(when).error_msg = "${bad}"`.
message InvalidWhenPlaceholder {
    // Validates `value` with `(when).in = PAST`, `(when).error_msg = "${bad}"`.
    google.protobuf.Timestamp value = 1 [(when).in = PAST, (when).error_msg = "${bad}"];
}
// Deliberately tests invalid configuration `(when).in = 99`.
message InvalidWhenValue {
    // Validates `value` with `(when).in = 99`.
    google.protobuf.Timestamp value = 1 [(when).in = 99];
}

// Fixture `NestedWhenValue` exercises `(when)`, `(required)`.
message NestedWhenValue {
    // Validates `future` with `(when).in = FUTURE`.
    google.protobuf.Timestamp future = 1 [(when).in = FUTURE];
    // Validates `label` with `(required) = true`.
    string label = 2 [(required) = true];
}
// Fixture `NestedWhenEnvelope` exercises `(when)`, `(validate)`.
message NestedWhenEnvelope {
    // Validates `first_future` with `(when).in = FUTURE`.
    google.protobuf.Timestamp first_future = 1 [(when).in = FUTURE];
    // Validates `nested` with `(validate) = true`.
    NestedWhenValue nested = 2 [(validate) = true];
}
